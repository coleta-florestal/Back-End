name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Generate Release and Changelog
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Semantic Releases plugins
        run: >
          npm install -D 
          semantic-release 
          @semantic-release/changelog 
          @semantic-release/git
          
      - name: Executar Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
